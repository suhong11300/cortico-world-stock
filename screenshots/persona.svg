  <text x="60" y="112" fill="#4f6280" font-size="15" font-family="'Segoe UI Emoji','Apple Color Emoji','Microsoft YaHei',system-ui,sans-serif">personaMode=rewrite：数字与个股原样给出去，口吻与节奏由人格和模型决定</text>
